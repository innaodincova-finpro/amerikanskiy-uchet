@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-display: swap; font-weight: 500; src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
:root{
  --ground:#F4F7FA; --card:#fff; --soft:#F7FAFC;
  --navy:#28425C; --navy2:#1E3348; --accent:#3E6B8F; --accent-soft:#E4EDF5;
  --ochre:#B08347; --ochre-soft:#F6EEE1;
  --ink:#22303F; --ink2:#4A5D71; --ink3:#7C8DA0; --line:#D9E2EA; --line2:#E8EEF4;
  --ok:#4B7F62; --ok-soft:#E6F0EA; --bad:#A85147; --bad-soft:#F8ECE5;
  --t-asset:#E4EDF5; --t-liab:#F6EEE1; --t-eq:#ECE8F4; --t-rev:#E6F0EA; --t-exp:#F8ECE5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:var(--ground);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 8% 6%,rgba(62,107,143,.14),transparent 32%),
             radial-gradient(circle at 92% 30%,rgba(176,131,71,.10),transparent 30%),
             linear-gradient(160deg,#F7FAFC 0%,#F1F5F9 55%,#F6F4EF 100%)}
h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:600;margin:0;text-wrap:balance}
button,input,select,textarea{font-family:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

:root{
  --ground:#F3F6F9; --card:#fff; --soft:#F6F9FB;
  --navy:#28425C; --accent:#3E6B8F; --accent-soft:#E6EEF5;
  --ochre:#B08347; --ochre-soft:#F6EEE1;
  --ink:#22303F; --ink2:#4A5D71; --ink3:#7C8DA0; --line:#D9E2EA; --line2:#E6ECF2;
  --ok:#4B7F62; --ok-soft:#E6F0EA; --bad:#A85147; --bad-soft:#F8ECE5;
  --t-asset:#3E6B8F; --t-liab:#B08347; --t-eq:#6F6A9C; --t-rev:#4B7F62; --t-exp:#A85147;
  --top:calc(54px + env(safe-area-inset-top)); --bot:calc(68px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;background:var(--ground);
  padding:var(--top) 0 var(--bot)}
h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:600;margin:0}
button,input,select{font-family:inherit;color:inherit;font-size:17px}
button{touch-action:manipulation}

/* Шапка — одна строка */
.appbar{position:fixed;top:0;left:0;right:0;z-index:40;height:var(--top);padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:10px;color:#fff;
  background:linear-gradient(110deg,#22394F 0%,#28425C 55%,#33597B 100%);box-shadow:0 4px 16px rgba(30,51,72,.18)}
.appbar svg{width:26px;height:26px;flex:none}
.appbar h1{font-size:20px;line-height:1;color:#fff}
.appbar .where{font-size:14px;color:#E9D2A8;white-space:nowrap}
.appbar .saved{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#7FB795;box-shadow:0 0 0 4px rgba(127,183,149,.2)}

main{max-width:600px;margin:0 auto;padding:16px 16px 20px}
.screen-title{font-size:24px;color:var(--navy);margin:4px 2px 4px}
.screen-sub{font-size:15px;color:var(--ink3);margin:0 2px 16px}

.card{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(28,43,58,.04),0 10px 24px -16px rgba(28,43,58,.25)}
.muted{color:var(--ink3);font-size:15px}
.en{font-weight:600}
.tr{color:var(--accent)}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}
.big{font-size:20px}

/* Кнопки — от 52 px */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;cursor:pointer;font-weight:600;font-size:17px;padding:0 18px;color:#fff;
  background:linear-gradient(110deg,#28425C,#3E6B8F);box-shadow:0 8px 18px rgba(30,51,72,.2)}
.btn:active{transform:scale(.985)}
.btn.light{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45}
.btns2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}

/* Подсказка, сворачивается */
.hint{border-radius:16px;background:var(--ochre-soft);color:#7A5A2C;margin-bottom:14px;overflow:hidden}
.hint summary{list-style:none;cursor:pointer;min-height:50px;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600;font-size:15.5px}
.hint summary::-webkit-details-marker{display:none}
.hint summary:after{content:'▾';margin-left:auto;transition:transform .2s}
.hint[open] summary:after{transform:rotate(180deg)}
.hint .in{padding:0 16px 14px;font-size:15.5px}

/* Раздел урока — свёрнутый блок */
.sec{background:var(--card);border:1px solid var(--line2);border-radius:18px;margin-bottom:10px;box-shadow:0 1px 2px rgba(28,43,58,.04);overflow:hidden}
.sec>button{width:100%;min-height:62px;border:0;background:none;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left;cursor:pointer;font-weight:600;font-size:17px;color:var(--ink)}
.sec>button .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:14px}
.sec>button:after{content:'▾';margin-left:auto;color:var(--ink3);transition:transform .2s}
.sec.open>button:after{transform:rotate(180deg)}
.sec.open>button .no{background:var(--navy);color:#fff}
.sec .body{display:none;padding:0 18px 18px}
.sec.open .body{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.types{display:grid;gap:8px;margin-bottom:12px}
.ty{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:10px 12px;border-radius:12px;background:var(--soft);border-left:4px solid}
.ty b{font-size:16px}.ty .tr{font-size:14px;grid-column:1}.ty i{font-style:normal;grid-column:2;grid-row:1;text-align:right;font-size:15px}
.ty em{font-style:normal;grid-column:2;grid-row:2;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink3)}
.ty.t-asset{border-color:var(--t-asset)}.ty.t-liab{border-color:var(--t-liab)}.ty.t-eq{border-color:var(--t-eq)}.ty.t-rev{border-color:var(--t-rev)}.ty.t-exp{border-color:var(--t-exp)}
.rule{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.rule div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px}
.rule b{display:block;color:var(--navy);font-size:14px;margin-bottom:2px}
.nums{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.nums span{font-family:'IBM Plex Mono',monospace;color:var(--ochre);font-weight:500}

/* Прогресс */
.progress{display:flex;align-items:center;gap:10px;margin:0 2px 14px}
.progress .lbl{font-size:15px;color:var(--ink2);white-space:nowrap}
.dots{display:flex;gap:6px;flex:1;justify-content:flex-end}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--accent)}.dots i.now{background:var(--ochre);transform:scale(1.25)}

/* Задание */
.q{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:18px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:14px;font-weight:600;color:var(--ink3);margin-bottom:6px;letter-spacing:.02em}
select,input[type=text],input[type=number]{width:100%;min-height:54px;font-size:17px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#7C8DA0 50%),linear-gradient(135deg,#7C8DA0 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
input[type=number]{font-family:'IBM Plex Mono',monospace}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(62,107,143,.15)}
.tr-row{margin-bottom:12px}
.tr-row label{display:block;font-weight:600;margin-bottom:6px}

/* Итог */
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.score div{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:14px;text-align:center}
.score b{display:block;font-family:'IBM Plex Mono',monospace;font-size:30px;color:var(--ochre)}
.score span{font-size:14px;color:var(--ink3)}
.res{border-radius:16px;margin-bottom:8px;border:1px solid var(--line2);background:var(--card);overflow:hidden}
.res>button{width:100%;min-height:58px;border:0;background:none;display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left;font-size:16px;cursor:pointer;color:var(--ink)}
.res .mk{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.res.ok .mk{background:var(--ok)}.res.bad .mk{background:var(--bad)}
.res .body{display:none;padding:0 14px 14px 54px;font-size:15.5px;color:var(--ink2)}
.res.open .body{display:block}

/* Слова */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E7EDF3;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{min-height:46px;border:0;border-radius:11px;background:none;font-weight:600;font-size:16px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(28,43,58,.1)}
.grp{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);margin:18px 4px 8px}
.wl{background:var(--card);border:1px solid var(--line2);border-radius:18px;overflow:hidden}
.w{width:100%;min-height:68px;border:0;background:none;display:flex;align-items:center;gap:12px;padding:8px 14px;text-align:left;border-bottom:1px solid var(--line2);cursor:pointer}
.w:last-child{border-bottom:0}
.w .t{flex:1;min-width:0}
.w .t b{display:block;font-size:17px}
.w .t span{color:var(--accent);font-size:15px}
.w .t i{font-style:normal;color:var(--ink3);font-size:14px;margin-left:6px}
.w .pl{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:16px}
.w.playing{background:var(--ochre-soft)}.w.playing .pl{background:var(--ochre);color:#fff}

/* Счета */
.acc{background:var(--card);border:1px solid var(--line2);border-radius:16px;margin-bottom:8px;overflow:hidden;border-left:5px solid}
.acc.t-asset{border-left-color:var(--t-asset)}.acc.t-liab{border-left-color:var(--t-liab)}.acc.t-eq{border-left-color:var(--t-eq)}.acc.t-rev{border-left-color:var(--t-rev)}.acc.t-exp{border-left-color:var(--t-exp)}
.acc>button{width:100%;min-height:64px;border:0;background:none;display:flex;align-items:center;gap:10px;padding:8px 14px;text-align:left;cursor:pointer;color:var(--ink)}
.acc>button .t{flex:1;min-width:0}.acc>button b{display:block;font-size:17px}.acc>button .t>span{color:var(--accent);font-size:14.5px}
.acc>button .ru{font-family:'IBM Plex Mono',monospace;color:var(--ochre);font-size:15px;white-space:nowrap}
.acc .body{display:none;padding:0 14px 14px;font-size:15.5px;color:var(--ink2)}
.acc.open .body{display:block}
.acc .body .btn{margin-top:10px;min-height:48px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 2px 14px;font-size:14px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* Ещё */
.item{width:100%;min-height:60px;border:0;background:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px;border-bottom:1px solid var(--line2);font-size:16.5px;text-align:left;cursor:pointer;color:var(--ink)}
.item:last-child{border-bottom:0}
.item .n{font-family:'IBM Plex Mono',monospace;color:var(--ochre);margin-right:10px}
.st{font-size:13px;font-weight:600;border-radius:20px;padding:4px 10px;white-space:nowrap}
.st.cur{background:var(--accent-soft);color:var(--accent)}.st.done{background:var(--ok-soft);color:var(--ok)}.st.wait{background:#EEF2F6;color:var(--ink3)}
.sec-h{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);margin:0 0 10px}
.msg{font-size:15px;margin-top:10px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.note{background:var(--ochre-soft);border-radius:14px;padding:12px 14px;font-size:15px;color:#7A5A2C;margin-bottom:12px}
textarea.copybox{width:100%;height:140px;font-size:14px;margin-top:10px;border-radius:12px;border:1px solid var(--line);padding:10px}
.hidden{display:none}
.sec .body.flat{padding:0}
.sec .body.flat .wl{border:0;border-top:1px solid var(--line2);border-radius:0}
.more-ok{width:100%;min-height:50px;border:1.5px dashed var(--line);border-radius:14px;background:none;color:var(--ink2);font-size:15.5px;font-weight:600;cursor:pointer;margin:2px 0 8px}

/* Нижние вкладки */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--bot);display:flex;padding:6px 6px env(safe-area-inset-bottom);
  background:rgba(250,252,254,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line2)}
nav button{flex:1;border:0;background:none;border-radius:14px;margin:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--navy);font-weight:700;background:var(--accent-soft)}
nav button.on .ic{color:var(--ochre)}
</style>
</head>
<body>
<header class="appbar">
  <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0DAA8"/><stop offset="1" stop-color="#B08347"/></linearGradient></defs>
  <rect x="6" y="14" width="52" height="9" rx="4.5" fill="url(#gg)"/><rect x="27.5" y="14" width="9" height="44" rx="4.5" fill="url(#gg)"/></svg>
  <h1>Bookkeeping</h1><span class="where" id="where">· Урок 1</span>
  <i class="saved" title="Сохранено"></i>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-v="theory"><span class="ic">✦</span>Урок</button>
  <button data-v="words"><span class="ic">♪</span>Слова</button>
  <button data-v="task"><span class="ic">✎</span>Задание</button>
  <button data-v="ref"><span class="ic">⇄</span>Счета</button>
  <button data-v="more"><span class="ic">≡</span>Ещё</button>
</nav>
<script src="exceljs.min.js"></script>
<script>
/* ===================== СОДЕРЖАНИЕ КУРСА ===================== */

const TYPES = {
  asset:{ru:"Актив", cls:"t-asset", xl:"FFE3EEF7"},
  liab: {ru:"Обязательство", cls:"t-liab", xl:"FFFDEEDE"},
  eq:   {ru:"Капитал", cls:"t-eq", xl:"FFECE6F7"},
  rev:  {ru:"Доход", cls:"t-rev", xl:"FFE5F4EC"},

const synth = window.speechSynthesis || null;

function pickVoice(){ if(!synth) return; const v = synth.getVoices();
  voice = v.find(x=>x.lang==="en-US" && /Samantha|Google US English|Aaron|Nicky/i.test(x.name)) || v.find(x=>x.lang==="en-US") || v.find(x=>x.lang && x.lang.startsWith("en")) || null; }
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function speak(text, el){
  return new Promise(res=>{
    if(!synth){ res(); return; }
    try{
      const u = new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate= slow?0.55:0.9; if(voice) u.voice=voice;
      if(el) el.classList.add("playing");
      const done=()=>{ if(el) el.classList.remove("playing"); res(); };
      u.onend=done; u.onerror=done; synth.speak(u);
    }catch(e){ res(); }
  });
}

/* ===================== ЗАДАНИЕ: по одному шагу ===================== */
function rTask(){
  const les=L(), A=ans(les.id), n=les.entries.length, pages=Math.ceil(les.transl.length/TR_PAGE), total=n+pages;
  if(A.checked) return rResult();
  if(step>total-1) step=total-1;
  const dots=Array.from({length:total},(_,i)=>`<i class="${i<step?"done":i===step?"now":""}"></i>`).join("");
  let h=`<div class="progress"><span class="lbl">${step<n?`Проводка ${step+1} из ${n}`:`Перевод ${step-n+1} из ${pages}`}</span><div class="dots">${dots}</div></div>`;
  if(step===0) h+=`<details class="hint"><summary>Как выполнять</summary><div class="in">Выберите счёт дебета и счёт кредита, впишите сумму без знака доллара. После проводок — перевод слов на двух экранах, затем проверка.</div></details>`;
  if(step<n){
    const e=les.entries[step], a=A.a[step]||{}, names=accNames();
    const opt=sel=>`<option value="">Выберите счёт</option>`+names.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("");
    h+=`<div class="card"><div class="q">${esc(e.q)}</div>
      <div class="fld"><label>ДЕБЕТ (Дт)</label><select data-f="dr">${opt(a.dr)}</select></div>
      <div class="fld"><label>КРЕДИТ (Кт)</label><select data-f="cr">${opt(a.cr)}</select></div>
      <div class="fld"><label>СУММА, $</label><input type="number" inputmode="numeric" data-f="sum" value="${a.sum??""}" placeholder="0"></div></div>`;
  } else {
    h+=`<div class="card"><div class="q">Переведите на русский</div>`;
    const p0=(step-n)*TR_PAGE; les.transl.slice(p0,p0+TR_PAGE).forEach((t,j)=>{ const i=p0+j; h+=`<div class="tr-row"><label>${esc(t.en)}</label><input type="text" data-b="${i}" value="${esc(A.b[i]||"")}" autocomplete="off" autocapitalize="off"></div>`; });
    h+=`</div>`;
  }
  h+=`<div class="btns2"><button class="btn light" id="bk" ${step===0?"disabled":""}>Назад</button><button class="btn" id="fw">${step<total-1?"Далее":"Проверить"}</button></div><div id="m"></div>`;
  V.innerHTML=h;
  V.querySelectorAll("[data-f]").forEach(el=>{ const f=()=>{ A.a[step]=A.a[step]||{}; A.a[step][el.dataset.f]= el.dataset.f==="sum"?(el.value===""?"":Number(el.value)):el.value; save(); }; el.onchange=f; el.oninput=f; });
  V.querySelectorAll("[data-b]").forEach(el=>{ el.oninput=()=>{ A.b[+el.dataset.b]=el.value; save(); }; });
  document.getElementById("bk").onclick=()=>{ step--; rTask(); window.scrollTo(0,0); };
  document.getElementById("fw").onclick=()=>{
    if(step<total-1){ step++; rTask(); window.scrollTo(0,0); return; }
    const empty = les.entries.some((e,i)=>!A.a[i]||!A.a[i].dr||!A.a[i].cr||A.a[i].sum===""||A.a[i].sum===undefined) || les.transl.some((t,i)=>!(A.b[i]||"").trim());
    const m=document.getElementById("m");
    if(empty && m.dataset.warned!=="1"){ m.dataset.warned="1"; m.innerHTML=`<div class="msg bad">Заполнено не всё. Нажмите «Проверить» ещё раз, чтобы проверить как есть.</div>`; return; }
    A.checked=true;
    if(les.entries.every((e,i)=>checkEntry(e,A.a[i])) && les.transl.every((t,i)=>checkTr(t,A.b[i]))) S.done[les.id]=true;
    save(); openRes=-1; showOk={a:false,b:false}; rTask(); window.scrollTo(0,0);
  };
}
function rResult(){
  const les=L(), A=ans(les.id);
  const ea=les.entries.map((e,i)=>({ok:checkEntry(e,A.a[i]),
     title:`${i+1}. ${e.q}`, body:(checkEntry(e,A.a[i])?"":`Ваш ответ: Дт ${esc((A.a[i]||{}).dr||"—")} / Кт ${esc((A.a[i]||{}).cr||"—")} / ${(A.a[i]||{}).sum??"—"}<br><b>Правильно: Дт ${esc(e.dr)} / Кт ${esc(e.cr)} / ${fmt(e.sum)}</b><br>`)+esc(e.why)}));
  const eb=les.transl.map((t,i)=>({ok:checkTr(t,A.b[i]), title:t.en, body:`Ваш ответ: ${esc(A.b[i]||"—")}<br>Правильно: ${esc(t.ans)}`}));
  const okA=ea.filter(x=>x.ok).length, okB=eb.filter(x=>x.ok).length;
  let k=0;
  const row=x=>{ const id=k++; return `<div class="res ${x.ok?"ok":"bad"} ${openRes===id?"open":""}"><button data-r="${id}"><span class="mk">${x.ok?"✓":"✕"}</span>${esc(x.title)}</button><div class="body">${x.body}</div></div>`; };
  const group=(key,name,arr,ok)=>{
    const bad=arr.filter(x=>!x.ok), good=arr.filter(x=>x.ok);
    let g=`<div class="grp">${name} · ${ok} из ${arr.length}</div>`;
    g+= bad.length ? bad.map(row).join("") : `<div class="note" style="background:var(--ok-soft);color:var(--ok)">Ошибок нет.</div>`;
    if(good.length) g+=`<button class="more-ok" data-k="${key}">${showOk[key]?"Скрыть":"Показать"} верные ответы (${good.length}) ${showOk[key]?"▴":"▾"}</button>`+(showOk[key]?good.map(row).join(""):good.map(()=>{k++;return""}).join(""));
    return g;
  };
  let h=`<h2 class="screen-title">Результат</h2><p class="screen-sub">Нажмите на строку, чтобы увидеть разбор</p>
  <div class="score"><div><b>${okA}/${ea.length}</b><span>проводки</span></div><div><b>${okB}/${eb.length}</b><span>перевод</span></div></div>`;
  h+=group("a","Проводки",ea,okA)+group("b","Перевод",eb,okB);
  h+=`<div style="display:grid;gap:10px;margin-top:16px"><button class="btn" id="cp">Отправить ответы Claude на разбор</button><button class="btn light" id="ag">Решить заново</button></div><div id="cpMsg"></div>`;
  V.innerHTML=h;
  V.querySelectorAll(".res>button").forEach(b=>b.onclick=()=>{ const id=+b.dataset.r; openRes=openRes===id?-1:id; V.querySelectorAll(".res").forEach(el=>el.classList.toggle("open",+el.querySelector("button").dataset.r===openRes)); });
  V.querySelectorAll(".more-ok").forEach(b=>b.onclick=()=>{ showOk[b.dataset.k]=!showOk[b.dataset.k]; const y=window.scrollY; rResult(); window.scrollTo(0,y); });
  document.getElementById("cp").onclick=()=>copyAnswers(document.getElementById("cpMsg"));
  document.getElementById("ag").onclick=()=>{ A.checked=false; A.a=[]; A.b=[]; delete S.done[les.id]; step=0; save(); rTask(); window.scrollTo(0,0); };
}

/* ===================== СЧЕТА ===================== */
function rRef(){
  const list=ACCOUNTS.filter(a=>a[6] <= S.cur+1);
  const col={asset:"var(--t-asset)",liab:"var(--t-liab)",eq:"var(--t-eq)",rev:"var(--t-rev)",exp:"var(--t-exp)"};
  let h=`<h2 class="screen-title">Счета</h2><p class="screen-sub">Американский счёт и российский аналог. Нажмите на счёт, чтобы раскрыть</p>
  <details class="hint"><summary>Что значат цвета</summary><div class="in"><div class="legend" style="margin:0">${Object.entries(TYPES).map(([k,t])=>`<span><i style="background:${col[k]}"></i>${t.ru}</span>`).join("")}</div></div></details>`;
  let k=0;
  ["asset","liab","eq","rev","exp"].forEach(tp=>list.filter(a=>a[3]===tp).forEach(a=>{ const id=k++;
    h+=`<div class="acc t-${tp} ${openAcc===id?"open":""}"><button data-a="${id}"><span class="t"><b>${esc(a[0])}</b><span>${esc(a[1])}</span></span><span class="ru">${esc(a[4])}</span></button>
    <div class="body"><b>${esc(a[2])}</b> · ${TYPES[tp].ru}<br>${esc(a[5])}<button class="btn light" data-say="${esc(a[0])}">▶ Слушать</button></div></div>`; }));
  V.innerHTML=h;
  V.querySelectorAll(".acc>button").forEach(b=>b.onclick=()=>{ const id=+b.dataset.a; openAcc=openAcc===id?-1:id; V.querySelectorAll(".acc").forEach((el,j)=>el.classList.toggle("open",j===openAcc)); });
  V.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{ hush(); speak(b.dataset.say,null); });
}

/* ===================== ЕЩЁ ===================== */
function answersText(){
  const les=L(), A=ans(les.id);
  let t=`${les.title}\nПроводки:\n`;
  les.entries.forEach((e,i)=>{ const a=A.a[i]||{}; t+=`${i+1}. ${e.q}\n   Дт ${a.dr||"—"} / Кт ${a.cr||"—"} / сумма ${a.sum??"—"}\n`; });
  t+=`Перевод:\n`; les.transl.forEach((tr,i)=>{ t+=`${tr.en} — ${A.b[i]||"—"}\n`; });
  return t;
}
async function copyAnswers(m){
  const t=answersText();
  try{ await navigator.clipboard.writeText(t); m.innerHTML=`<div class="msg ok">Ответы скопированы. Вставьте их в чат с Claude и напишите «проверь».</div>`; }
  catch(e){ m.innerHTML=`<div class="msg">Нажмите на поле, выберите «Выбрать все» и «Скопировать».</div><textarea class="copybox" readonly>${esc(t)}</textarea>`; }
}
function rMore(){
  const done=Object.keys(S.done).length;
  let lessons="";
  for(let i=0;i<TOTAL_LESSONS;i++){ const les=LESSONS[i];
    const st= les&&S.done[les.id] ? ["пройден","done"] : les ? [i===S.cur?"текущий":"открыт","cur"] : ["позже","wait"];
    lessons+=`<button class="item" ${les?`data-i="${i}"`:"disabled"}><span><span class="n">${String(i+1).padStart(2,"0")}</span>${les?esc(les.title.replace(/^Урок \d+\. /,"")):"Урок "+(i+1)}</span><span class="st ${st[1]}">${st[0]}</span></button>`; }
  const secs=[
    ["▦",`Уроки · пройдено ${done} из ${TOTAL_LESSONS}`, lessons],
    ["✓","Разбор у Claude", `<p class="muted">Скопируйте ответы, вставьте в чат с Claude и напишите «проверь».</p><button class="btn" id="cp">Скопировать ответы</button><div id="cpMsg"></div>`],
    ["⤓","Файл Excel", `<p class="muted">Справочник счетов, тренировка проводок, пустой журнал и ваши ответы. Храните файл у себя — это ваша копия.</p><button class="btn" id="xl">Скачать файл Excel</button><div id="xlMsg"></div><p class="muted" style="margin-top:10px" id="stamp">${S.savedAt?"Последняя копия: "+esc(S.savedAt):"Копия ещё не сохранялась"}</p>`],
    ["↺","Восстановление из файла", `<p class="muted">Новый телефон или пропали ответы — выберите ранее скачанный файл Excel.</p><label class="btn light" for="rf">Выбрать файл</label><input type="file" id="rf" accept=".xlsx" class="hidden"><div id="rfMsg"></div>`]
  ];
  let h=`<h2 class="screen-title">Ещё</h2><p class="screen-sub">Уроки курса, разбор и сохранение</p>`;
  secs.forEach(([ic,t,body],i)=>{ h+=`<div class="sec ${i===openMore?"open":""}"><button data-m="${i}"><span class="no">${ic}</span>${t}</button><div class="body">${body}</div></div>`; });
  V.innerHTML=h;
  V.querySelectorAll(".sec>button").forEach(b=>b.onclick=()=>{ const i=+b.dataset.m; openMore=openMore===i?-1:i; V.querySelectorAll(".sec").forEach((el,j)=>el.classList.toggle("open",j===openMore)); });
  V.querySelectorAll(".item[data-i]").forEach(b=>b.onclick=()=>{ S.cur=+b.dataset.i; save(); step=0; go("theory"); });
  document.getElementById("cp").onclick=()=>copyAnswers(document.getElementById("cpMsg"));
  document.getElementById("xl").onclick=downloadXl;
  document.getElementById("rf").onchange=restore;
}
function rCopyStamp(){ const p=document.getElementById("stamp"); if(p) p.textContent="Последняя копия: "+S.savedAt; }

/* ===================== EXCEL ===================== */
async function buildWorkbook(){
  const wb = new ExcelJS.Workbook();
  wb.creator = "Bookkeeping — бухгалтерский учёт США";
  const head = (ws,row)=>{ row.font={bold:true}; row.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFDDE7F0"}}; row.alignment={vertical:"middle",wrapText:true}; };
  const list = ACCOUNTS.filter(a=>a[6] <= S.cur+1);

  /* Лист 1: Счета */
  const s1 = wb.addWorksheet("Счета");
  s1.columns=[{header:"Счёт (англ.)",width:24},{header:"Транскрипция",width:22},{header:"Перевод",width:32},{header:"Вид счёта",width:16},{header:"Российский счёт",width:16},{header:"Пояснение",width:60}];
  head(s1,s1.getRow(1));
  ["asset","liab","eq","rev","exp"].forEach(tp=>list.filter(a=>a[3]===tp).forEach(a=>{
    const r=s1.addRow([a[0],a[1],a[2],TYPES[tp].ru,a[4],a[5]]);
    r.eachCell(c=>{ c.fill={type:"pattern",pattern:"solid",fgColor:{argb:TYPES[tp].xl}}; c.alignment={vertical:"top",wrapText:true}; });
    r.getCell(1).font={bold:true};
  }));
  s1.views=[{state:"frozen",ySplit:1}];
  const nAcc = list.length + 1;
  const listRef = `'Счета'!$A$2:$A$${nAcc}`;

  /* Скрытый лист с правильными ответами */
  const sk = wb.addWorksheet("_ответы",{state:"veryHidden"});

  /* Лист 2: Тренировка проводок */
  const s2 = wb.addWorksheet("Тренировка проводок");
  s2.addRow(["Составьте проводку: выберите счета дебета и кредита из списка, впишите сумму. Результат появится справа."]);
  s2.mergeCells("A1:G1"); s2.getRow(1).font={italic:true}; s2.getRow(1).height=30; s2.getCell("A1").alignment={wrapText:true,vertical:"middle"};
  s2.addRow(["Урок","№","Операция","Дебет (Дт)","Кредит (Кт)","Сумма, $","Результат"]); head(s2,s2.getRow(2));
  s2.columns.forEach((c,i)=>c.width=[8,5,52,24,24,12,14][i]);
  let r=3, k=1;
  LESSONS.slice(0,S.cur+1).forEach((les,li)=>les.entries.forEach((e,i)=>{
    sk.getCell(k,1).value=e.dr; sk.getCell(k,2).value=e.cr; sk.getCell(k,3).value=e.sum;
    s2.getCell(r,1).value=li+1; s2.getCell(r,2).value=i+1; s2.getCell(r,3).value=e.q; s2.getCell(r,3).alignment={wrapText:true,vertical:"top"};
    ["D","E"].forEach(col=>{ s2.getCell(`${col}${r}`).dataValidation={type:"list",allowBlank:true,formulae:[listRef]}; s2.getCell(`${col}${r}`).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF8E6"}}; });
    s2.getCell(`F${r}`).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF8E6"}}; s2.getCell(`F${r}`).numFmt="#,##0";
    s2.getCell(`G${r}`).value={formula:`IF(OR(D${r}="",E${r}="",F${r}=""),"",IF(AND(D${r}='_ответы'!A${k},E${r}='_ответы'!B${k},F${r}='_ответы'!C${k}),"верно","неверно"))`};
    r++; k++;
  }));
  s2.addConditionalFormatting({ref:`G3:G${r}`,rules:[
    {type:"containsText",operator:"containsText",text:"неверно",style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:"FFFBE9E7"}},font:{color:{argb:"FFB3261E"},bold:true}}},
    {type:"cellIs",operator:"equal",formulae:['"верно"'],style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:"FFE5F4EC"}},font:{color:{argb:"FF1E7A46"},bold:true}}}
  ]});
  s2.views=[{state:"frozen",ySplit:2}];

  /* Лист 3: Пустой журнал */
  const s3 = wb.addWorksheet("Журнал проводок");
  s3.addRow(["General Journal (джена́рал джё́рнал) — журнал проводок. Каждая проводка: строка дебета, затем строка кредита."]);
  s3.mergeCells("A1:E1"); s3.getRow(1).font={italic:true}; s3.getRow(1).height=30; s3.getCell("A1").alignment={wrapText:true,vertical:"middle"};
  s3.addRow(["Date (дата)","Account (счёт)","Debit (дебет)","Credit (кредит)","Description (пояснение)"]); head(s3,s3.getRow(2));
  s3.columns.forEach((c,i)=>c.width=[14,26,14,14,44][i]);
  for(let i=3;i<=52;i++){
    s3.getCell(`A${i}`).numFmt="dd.mm.yyyy";
    s3.getCell(`B${i}`).dataValidation={type:"list",allowBlank:true,formulae:[listRef]};
    s3.getCell(`C${i}`).numFmt="#,##0.00"; s3.getCell(`D${i}`).numFmt="#,##0.00";
  }
  s3.getCell("B53").value="Итого"; s3.getCell("B53").font={bold:true};
  s3.getCell("C53").value={formula:"SUM(C3:C52)"}; s3.getCell("D53").value={formula:"SUM(D3:D52)"};
  s3.getCell("C53").numFmt="#,##0.00"; s3.getCell("D53").numFmt="#,##0.00";
  s3.getCell("E53").value={formula:`IF(C53=D53,"Дебет равен кредиту — верно","Дебет не равен кредиту — ищите ошибку")`};
  s3.getRow(53).font={bold:true};
  s3.views=[{state:"frozen",ySplit:2}];

  /* Лист 4: Мои ответы */
  const s4 = wb.addWorksheet("Мои ответы");
  s4.addRow(["Урок","Задание","Мой ответ","Правильный ответ","Результат"]); head(s4,s4.getRow(1));
  s4.columns.forEach((c,i)=>c.width=[8,46,40,40,12][i]);
  LESSONS.slice(0,S.cur+1).forEach((les,li)=>{
    const A=ans(les.id);
    les.entries.forEach((e,i)=>{ const a=A.a[i]||{};
      s4.addRow([li+1, e.q, a.dr?`Дт ${a.dr} / Кт ${a.cr||"—"} / ${a.sum??"—"}`:"—", `Дт ${e.dr} / Кт ${e.cr} / ${e.sum}`, A.checked?(checkEntry(e,a)?"верно":"неверно"):"не проверено"]); });
    les.transl.forEach((t,i)=>{ s4.addRow([li+1, `Перевод: ${t.en}`, A.b[i]||"—", t.ans, A.checked?(checkTr(t,A.b[i])?"верно":"неверно"):"не проверено"]); });
  });
  s4.eachRow(row=>row.alignment={wrapText:true,vertical:"top"});

  /* Служебный лист для восстановления */
  const sd = wb.addWorksheet("_data",{state:"veryHidden"});
  sd.getCell("A1").value = JSON.stringify(S);
  return wb;
}

async function downloadXl(){
  const m=document.getElementById("xlMsg");
  if(typeof ExcelJS==="undefined"){ m.innerHTML=`<div class="msg bad">Не удалось подготовить файл. Обновите страницу и попробуйте снова.</div>`; return; }
  m.innerHTML=`<div class="msg">Готовлю файл…</div>`;
  const d=new Date(); const stamp=`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
  S.savedAt = stamp + " " + String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const wb = await buildWorkbook();
  const buf = await wb.xlsx.writeBuffer();
  const name = `Bookkeeping ${stamp}.xlsx`;
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await Promise.race([window.claude.use("downloads"), new Promise(r=>setTimeout(()=>r(null),3000))]); }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename:name, data:new Blob([buf])}); save(); m.innerHTML=`<div class="msg ok">Файл сохранён.</div>`; rCopyStamp(); }
    catch(e){ m.innerHTML = e && e.code==="declined" ? `<div class="msg">Сохранение отменено.</div>` : `<div class="msg bad">Не удалось сохранить файл. Попробуйте ещё раз.</div>`; }
  } else {
    const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); save(); m.innerHTML=`<div class="msg ok">Файл скачан.</div>`;
  }
}

async function restore(ev){
  const m=document.getElementById("rfMsg"), f=ev.target.files[0]; if(!f) return;
  try{
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
    const sd=wb.getWorksheet("_data"); const raw = sd && sd.getCell("A1").value;
    if(!raw) throw 0;
    const data=JSON.parse(String(raw));
    if(!data || typeof data!=="object" || !data.answers) throw 0;
    S=Object.assign({cur:0,answers:{},done:{},savedAt:null},data);
    if(S.cur>=LESSONS.length) S.cur=LESSONS.length-1;
    save(); step=0; m.innerHTML=`<div class="msg ok">Данные восстановлены из файла.</div>`;
  }catch(e){ m.innerHTML=`<div class="msg bad">Это не файл копии из этого приложения. Выберите файл, скачанный кнопкой «Скачать файл Excel».</div>`; }
  ev.target.value="";
}

go("theory");
</script>
