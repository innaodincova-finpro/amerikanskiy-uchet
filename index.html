:root{
  --ground:#F4F7FA; --card:#fff; --soft:#F7FAFC;
  --navy:#28425C; --navy2:#1E3348; --accent:#3E6B8F; --accent-soft:#E4EDF5;
  --ochre:#B08347; --ochre-soft:#F6EEE1;
  --ink:#22303F; --ink2:#4A5D71; --ink3:#7C8DA0; --line:#D9E2EA; --line2:#E8EEF4;
  --ok:#4B7F62; --ok-soft:#E6F0EA; --bad:#A85147; --bad-soft:#F8ECE5;
  --t-asset:#E4EDF5; --t-liab:#F6EEE1; --t-eq:#ECE8F4; --t-rev:#E6F0EA; --t-exp:#F8ECE5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:var(--ground);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 8% 6%,rgba(62,107,143,.14),transparent 32%),
             radial-gradient(circle at 92% 30%,rgba(176,131,71,.10),transparent 30%),
             linear-gradient(160deg,#F7FAFC 0%,#F1F5F9 55%,#F6F4EF 100%)}
h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:600;margin:0;text-wrap:balance}
button,input,select,textarea{font-family:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* Шапка */
.appbar{position:sticky;top:0;z-index:40;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 14px;
  background:radial-gradient(circle at 86% -40%,rgba(255,255,255,.22),transparent 42%),linear-gradient(120deg,#22394F 0%,#28425C 45%,#3E6B8F 100%);
  box-shadow:0 10px 28px rgba(30,51,72,.22)}
.appbar .top{display:flex;align-items:center;gap:11px}
.appbar svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 3px 6px rgba(10,20,32,.35))}
.appbar h1{font-size:20px;line-height:1.15;color:#fff}
.appbar .sub{font-size:12.5px;color:rgba(220,230,240,.85);margin-top:1px}
.appbar .saved{margin-left:auto;font-size:11.5px;color:rgba(220,230,240,.85);display:flex;align-items:center;gap:6px;white-space:nowrap}
.appbar .saved i{width:7px;height:7px;border-radius:50%;background:#7FB795;box-shadow:0 0 0 3px rgba(127,183,149,.18)}

main{max-width:680px;margin:0 auto;padding:16px 14px 10px}
h2{font-size:22px;margin:2px 2px 14px;color:var(--navy)}
h3{font-size:17px;margin:20px 2px 10px;color:var(--navy)}

/* Карточки: перелив сверху вниз, светлая кромка, три ступени тени */
.card{background:linear-gradient(180deg,#FFFFFF 0%,#FBFCFE 100%);border:1px solid var(--line2);border-radius:20px;padding:16px 16px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(28,43,58,.04),0 10px 26px -14px rgba(28,43,58,.22),inset 0 1px 0 rgba(255,255,255,.95);
  animation:rise .38s ease both}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;margin-bottom:14px;color:#fff;
  background:linear-gradient(125deg,#28425C 0%,#3E6B8F 60%,#5A86A8 100%);box-shadow:0 14px 32px rgba(30,51,72,.24)}
.hero:before{content:'';position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%)}
.hero .k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#E9D2A8}
.hero .t{font-family:'Spectral',serif;font-size:22px;font-weight:600;line-height:1.2;margin-top:4px}
.hero .bar{height:7px;border-radius:7px;background:rgba(255,255,255,.18);margin-top:14px;overflow:hidden}
.hero .bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#D9B676,#B08347)}
.hero .p{font-size:12.5px;color:rgba(230,238,245,.9);margin-top:6px}
.muted{color:var(--ink3);font-size:14px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);margin-bottom:8px}
.en{font-weight:600;color:var(--ink)}
.tr{color:var(--accent);font-size:14.5px}
.card p{margin:8px 0}

table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line2)}
th,td{padding:8px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:0}
th{background:var(--soft);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
td:last-child{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2);word-spacing:-2px}
th:nth-child(1),td:nth-child(1){width:36%}th:nth-child(2),td:nth-child(2){width:30%}
.t-asset{background:var(--t-asset)} .t-liab{background:var(--t-liab)} .t-eq{background:var(--t-eq)} .t-rev{background:var(--t-rev)} .t-exp{background:var(--t-exp)}

/* Кнопки */
.btn{border:0;border-radius:14px;cursor:pointer;font-weight:500;font-size:15px;padding:11px 16px;color:#fff;
  background:linear-gradient(110deg,#28425C,#3E6B8F);box-shadow:0 8px 18px rgba(30,51,72,.22),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .16s ease,box-shadow .16s ease}
.btn:active{transform:scale(.985)}
.btn.light{background:linear-gradient(180deg,#FFFFFF,#F3F7FB);color:var(--navy);border:1px solid var(--line);box-shadow:0 2px 6px rgba(28,43,58,.06)}
.btn.gold{background:linear-gradient(110deg,#B08347,#C99A5B);box-shadow:0 8px 18px rgba(150,105,50,.24)}
.btn.small{font-size:13px;padding:7px 11px;border-radius:11px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* Слова */
.word{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2);padding:11px 4px;border-radius:12px;transition:background .2s}
.word:last-child{border-bottom:none}
.word .txt{flex:1;min-width:0}
.word.playing{background:var(--ochre-soft)}
.word .btns{display:flex;flex-direction:column;gap:6px}

/* Блоки «что сделать / данные / зачем» */
.block{border-left:3px solid var(--ochre);padding:1px 0 1px 12px;margin:9px 0}
.block .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ochre);margin-bottom:1px}

/* Задание */
.op{border:1px solid var(--line2);border-radius:16px;padding:13px;margin-bottom:10px;background:linear-gradient(180deg,#fff,#FAFCFE);box-shadow:0 1px 2px rgba(28,43,58,.04);animation:rise .38s ease both}
.op.ok{border-color:#B9D3C3;background:linear-gradient(180deg,#F3F9F5,#E9F3ED)}
.op.bad{border-color:#E3BFB8;background:linear-gradient(180deg,#FCF5F2,#F8ECE5)}
.op .q{font-weight:600;margin-bottom:9px;line-height:1.4}
.op .q b{font-family:'IBM Plex Mono',monospace;color:var(--ochre);margin-right:4px}
.fld{display:grid;grid-template-columns:56px 1fr;gap:6px 8px;align-items:center;margin-bottom:7px}
.fld label{font-size:13px;color:var(--ink3);font-weight:500}
select,input[type=text],input[type=number]{width:100%;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#7C8DA0 50%),linear-gradient(135deg,#7C8DA0 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=number]{font-family:'IBM Plex Mono',monospace}
select:focus,input:focus{outline:3px solid rgba(62,107,143,.18);border-color:var(--accent)}
.fb{font-size:14px;margin-top:9px;line-height:1.45}
.fb b{display:block}
.score{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--ochre)}

.legend span{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;margin:0 5px 6px 0;color:var(--ink2)}
.acc{border-radius:18px;padding:14px 15px;margin-bottom:10px;border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 2px rgba(28,43,58,.04),0 8px 20px -14px rgba(28,43,58,.22),inset 0 1px 0 rgba(255,255,255,.8);animation:rise .38s ease both}
.acc .num{font-family:'IBM Plex Mono',monospace;color:var(--ochre);font-weight:600}

.lesson-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line2);padding:11px 2px;cursor:pointer}
.lesson-item:last-child{border-bottom:none}
.lesson-item .n{font-family:'IBM Plex Mono',monospace;color:var(--ochre);font-weight:600;margin-right:8px}
.st{font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
.st.cur{background:var(--accent-soft);color:var(--accent)} .st.done{background:var(--ok-soft);color:var(--ok)} .st.wait{background:#EEF2F6;color:var(--ink3)}
.note{background:linear-gradient(115deg,#FBF5EA,#F6EEE1);border:1px solid #EAD9BC;border-radius:16px;padding:11px 13px;font-size:14px;color:#7A5A2C;margin-bottom:12px}
.msg{font-size:14px;margin-top:9px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

/* Нижние вкладки: стеклянный фон, активная — объёмной плашкой */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:2px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  background:rgba(250,252,254,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line2);box-shadow:0 -10px 28px rgba(28,43,58,.08)}
nav button{flex:1;border:0;background:none;padding:6px 1px 5px;font-size:11.5px;font-weight:500;color:var(--ink2);border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .16s,color .16s}
nav button .ic{font-size:19px;line-height:1;opacity:.75}
nav button.on{color:var(--navy);font-weight:600;background:linear-gradient(180deg,#FFFFFF,#EAF1F7);box-shadow:0 4px 12px rgba(30,51,72,.12),inset 0 1px 0 #fff}
nav button.on .ic{opacity:1;color:var(--ochre)}
.hidden{display:none}
textarea.copybox{width:100%;height:120px;font-size:13px;margin-top:8px;border-radius:12px;border:1px solid var(--line);padding:8px}

</style>
</head>

<header class="appbar"><div class="top">
  <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0DAA8"/><stop offset="1" stop-color="#B08347"/></linearGradient></defs>
  <rect x="9" y="16" width="46" height="7" rx="3.5" fill="url(#gg)"/><rect x="28.5" y="16" width="7" height="38" rx="3.5" fill="url(#gg)"/>
  <text x="18" y="12" font-family="Golos Text,sans-serif" font-size="10" font-weight="700" fill="#F0DAA8" text-anchor="middle">Dr</text>

<main id="view"></main>

</nav>

<script>
/* ===================== СОДЕРЖАНИЕ КУРСА ===================== */

const TYPES = {
  asset:{ru:"Актив", cls:"t-asset", xl:"FFE3EEF7"},
  liab: {ru:"Обязательство", cls:"t-liab", xl:"FFFDEEDE"},
  eq:   {ru:"Капитал", cls:"t-eq", xl:"FFECE6F7"},
  rev:  {ru:"Доход", cls:"t-rev", xl:"FFE5F4EC"},
  exp:  {ru:"Расход", cls:"t-exp", xl:"FFFBE9E7"}
};

/* Справочник счетов: en, транскрипция, перевод, вид, российский счёт, пояснение, урок */
const ACCOUNTS = [
  ["Cash","кэш","Деньги (касса и банк)","asset","50, 51, 52","В США касса и расчётный счёт обычно учитываются в одной группе Cash. Отдельный счёт открывают на каждый банковский счёт.",1],
  ["Accounts Receivable","эка́унтс риси́вэбл","Дебиторская задолженность покупателей","asset","62","Сокращённо A/R. Долг клиентов за отгруженные товары и оказанные услуги.",1],
  ["Equipment","икви́пмэнт","Оборудование","asset","01","Часть основных средств. Износ учитывается на отдельном счёте, его разберём позже.",1],
  ["Accounts Payable","эка́унтс пэ́йэбл","Задолженность поставщикам","liab","60","Сокращённо A/P. Наш долг поставщикам и подрядчикам.",1],
  ["Owner's Equity","о́унэрз э́квити","Вложения собственника","eq","80","Для небольших компаний с одним владельцем. В корпорациях вместо него Common Stock — акционерный капитал.",1],
  ["Retained Earnings","рите́йнд ё́рнингз","Нераспределённая прибыль","eq","84","Накопленная прибыль прошлых лет за вычетом выплат собственникам.",1],
  ["Service Revenue","сё́рвис рэ́вэнью","Выручка от услуг","rev","90.1","В РСБУ выручка проходит через счёт 90. В США это сразу отдельный счёт дохода.",1],
  ["Rent Expense","рэнт икспэ́нс","Расходы на аренду","exp","20, 26, 44","В РСБУ аренда относится на счета затрат по месту возникновения. В США — на отдельный счёт расходов по виду.",1]
];

const LESSONS = [
  {
    id:"l1",
    title:"Урок 1. Основа американского учёта",
    theory:`
<div class="card">
  <div class="tag">1. Главное равенство</div>
  <p><span class="en">Assets = Liabilities + Equity</span><br>
  <span class="tr">э́сэтс = лайэби́литиз + э́квити</span><br>
  Активы = Обязательства + Капитал</p>
  <p class="muted">Это то же равенство актива и пассива баланса, что и в РСБУ.</p>
</div>
<div class="card">
  <div class="tag">2. Пять видов счетов</div>
  <table>
    <tr><th>Вид</th><th>Перевод</th><th>Аналог в РСБУ</th></tr>
    <tr class="t-asset"><td><span class="en">Assets</span><br><span class="tr">э́сэтс</span></td><td>Активы</td><td>01, 10, 50, 51, 62</td></tr>
    <tr class="t-liab"><td><span class="en">Liabilities</span><br><span class="tr">лайэби́литиз</span></td><td>Обязательства</td><td>60, 66, 68, 70</td></tr>

const KEY = "amer-uchet-v1";
let S = {cur:0, answers:{}, done:{}, savedAt:null};
function load(){ try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function ans(lid){ if(!S.answers[lid]) S.answers[lid] = {a:[], b:[], checked:false}; return S.answers[lid]; }
load();
if(S.cur >= LESSONS.length) S.cur = LESSONS.length-1;

/* ===================== ЗВУК ===================== */
const synth = window.speechSynthesis || null;
let voice = null;
function pickVoice(){ if(!synth) return; const v = synth.getVoices();
  voice = v.find(x=>x.lang==="en-US" && /Samantha|Google US English|Aaron|Nicky/i.test(x.name)) || v.find(x=>x.lang==="en-US") || v.find(x=>x.lang && x.lang.startsWith("en")) || null; }
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
let stopAll = false;
function speak(text, rate, el){
  return new Promise(res=>{
    if(!synth){ res(); return; }
    try{
      const u = new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate; if(voice) u.voice=voice;
      if(el) el.classList.add("playing");
      const done=()=>{ if(el) el.classList.remove("playing"); res(); };
      u.onend=done; u.onerror=done; synth.speak(u);
    }catch(e){ res(); }
  });
}

const V = document.getElementById("view");

function checkEntry(e, a){ return a && a.dr===e.dr && a.cr===e.cr && Number(a.sum)===e.sum; }
function checkTr(t, v){ v=(v||"").toLowerCase().replace(/ё/g,"е"); return t.keys.some(k=>v.includes(k.replace(/ё/g,"е"))); }

function rTask(){
  const les=L(), A=ans(les.id), names=accNames();
  const opt = sel => `<option value="">— выберите счёт —</option>` + names.map(n=>`<option ${n===sel?"selected":""}>${esc(n)}</option>`).join("");
  let h = `<h2>Задание</h2>
  <div class="card">
    <div class="block"><div class="lbl">Что сделать</div>Составьте проводки (задание А) и переведите слова (задание Б).</div>
    <div class="block"><div class="lbl">Данные</div>Счёт дебета и счёт кредита — выбрать из списка.<br>Сумма — числом, без знака доллара.<br>Перевод — своими словами, по-русски.</div>
    <div class="block"><div class="lbl">Зачем</div>Проверить, что логика дебета и кредита в американском учёте стала привычной.</div>
  </div>
  <h3>А. Проводки</h3>`;
  les.entries.forEach((e,i)=>{
    const a=A.a[i]||{}, st = A.checked ? (checkEntry(e,a)?"ok":"bad") : "";
    h += `<div class="op ${st}"><div class="q"><b>${i+1}</b>${esc(e.q)}</div>
      <div class="fld"><label>Дт</label><select data-a="${i}" data-f="dr">${opt(a.dr)}</select></div>
      <div class="fld"><label>Кт</label><select data-a="${i}" data-f="cr">${opt(a.cr)}</select></div>
      <div class="fld"><label>Сумма</label><input type="number" inputmode="numeric" data-a="${i}" data-f="sum" value="${a.sum??""}"></div>`;
    if(A.checked){
      h += st==="ok" ? `<div class="fb"><b style="color:var(--ok)">Верно.</b>${esc(e.why)}</div>`
                     : `<div class="fb"><b style="color:var(--bad)">Неверно.</b>Правильно: Дт ${esc(e.dr)} ${fmt(e.sum)} / Кт ${esc(e.cr)} ${fmt(e.sum)}.<br>${esc(e.why)}</div>`;
    }
    h += `</div>`;
  });
  h += `<h3>Б. Переведите на русский</h3><div class="card">`;
  les.transl.forEach((t,i)=>{
    const v=A.b[i]||"", st = A.checked ? (checkTr(t,v)?"ok":"bad") : "";
    h += `<div class="op ${st}" style="margin-bottom:8px"><div class="q">${esc(t.en)}</div><input type="text" data-b="${i}" value="${esc(v)}" autocomplete="off">`;
    if(A.checked) h += st==="ok" ? `<div class="fb" style="color:var(--ok)">Верно.</div>` : `<div class="fb"><b style="color:var(--bad)">Неверно.</b>Правильно: ${esc(t.ans)}.</div>`;
    h += `</div>`;
  });
  h += `</div>
  <div class="row"><button class="btn" id="chk">Проверить</button>${A.checked?`<button class="btn light" id="again">Решить заново</button>`:""}</div>
  <div id="res"></div>`;
  if(A.checked){
    const okA = les.entries.filter((e,i)=>checkEntry(e,A.a[i])).length, okB = les.transl.filter((t,i)=>checkTr(t,A.b[i])).length;
    h += `<div class="card" style="margin-top:12px"><div class="tag">Результат</div><div class="row" style="gap:22px"><div><div class="score">${okA}/${les.entries.length}</div><div class="muted">проводки</div></div><div><div class="score">${okB}/${les.transl.length}</div><div class="muted">перевод</div></div></div>
      <p class="muted">Для подробного разбора откройте вкладку «Копия», нажмите «Скопировать ответы для проверки», вставьте в чат и напишите «проверь».</p></div>`;
  }
  V.innerHTML = h;
  V.querySelectorAll("[data-a]").forEach(el=>{
    const handler=()=>{ const i=+el.dataset.a; A.a[i]=A.a[i]||{}; A.a[i][el.dataset.f]= el.dataset.f==="sum" ? (el.value===""?"":Number(el.value)) : el.value; save(); };
    el.onchange=handler; el.oninput=handler;
  });
  V.querySelectorAll("[data-b]").forEach(el=>{ el.oninput=()=>{ A.b[+el.dataset.b]=el.value; save(); }; });
  document.getElementById("chk").onclick=()=>{
    const empty = les.entries.some((e,i)=>!A.a[i]||!A.a[i].dr||!A.a[i].cr||A.a[i].sum===""||A.a[i].sum===undefined) || les.transl.some((t,i)=>!(A.b[i]||"").trim());
    if(empty && !confirmBox()) return;
    A.checked=true;
    const all = les.entries.every((e,i)=>checkEntry(e,A.a[i])) && les.transl.every((t,i)=>checkTr(t,A.b[i]));
    if(all) S.done[les.id]=true;
    save(); rTask();
  };
  const ag=document.getElementById("again"); if(ag) ag.onclick=()=>{ A.checked=false; A.a=[]; A.b=[]; delete S.done[les.id]; save(); rTask(); };
}
let confirmArmed=false;
function confirmBox(){
  if(confirmArmed){ confirmArmed=false; return true; }
  confirmArmed=true;
  document.getElementById("res").innerHTML = `<div class="msg bad">Заполнены не все поля. Нажмите «Проверить» ещё раз, чтобы проверить как есть.</div>`;
  return false;
}

  document.getElementById("cp").onclick=async ()=>{
    const t=answersText(), m=document.getElementById("cpMsg");
    try{ await navigator.clipboard.writeText(t); m.innerHTML=`<div class="msg ok">Ответы скопированы. Вставьте их в чат с Claude и напишите «проверь».</div>`; }
    catch(e){ m.innerHTML=`<div class="msg">Скопируйте текст вручную: нажмите на поле, выберите «Выбрать все» и «Скопировать».</div><textarea class="copybox" readonly>${esc(t)}</textarea>`; }
  };
  document.getElementById("xl").onclick=downloadXl;
  document.getElementById("rf").onchange=restore;
}

/* ===================== EXCEL ===================== */
async function buildWorkbook(){
  const wb = new ExcelJS.Workbook();
  wb.creator = "Американский учёт";
  const head = (ws,row)=>{ row.font={bold:true}; row.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFDDE7F0"}}; row.alignment={vertical:"middle",wrapText:true}; };
  const list = ACCOUNTS.filter(a=>a[6] <= S.cur+1);

  /* Лист 1: Счета */
  const s1 = wb.addWorksheet("Счета");
  s1.columns=[{header:"Счёт (англ.)",width:24},{header:"Транскрипция",width:22},{header:"Перевод",width:32},{header:"Вид счёта",width:16},{header:"Российский счёт",width:16},{header:"Пояснение",width:60}];
  head(s1,s1.getRow(1));
  ["asset","liab","eq","rev","exp"].forEach(tp=>list.filter(a=>a[3]===tp).forEach(a=>{
    const r=s1.addRow([a[0],a[1],a[2],TYPES[tp].ru,a[4],a[5]]);
    r.eachCell(c=>{ c.fill={type:"pattern",pattern:"solid",fgColor:{argb:TYPES[tp].xl}}; c.alignment={vertical:"top",wrapText:true}; });
    r.getCell(1).font={bold:true};
  }));
  s1.views=[{state:"frozen",ySplit:1}];
  const nAcc = list.length + 1;
  const listRef = `'Счета'!$A$2:$A$${nAcc}`;

  /* Скрытый лист с правильными ответами */
  const sk = wb.addWorksheet("_ответы",{state:"veryHidden"});

  /* Лист 2: Тренировка проводок */
  const s2 = wb.addWorksheet("Тренировка проводок");
  s2.addRow(["Составьте проводку: выберите счета дебета и кредита из списка, впишите сумму. Результат появится справа."]);
  s2.mergeCells("A1:G1"); s2.getRow(1).font={italic:true}; s2.getRow(1).height=30; s2.getCell("A1").alignment={wrapText:true,vertical:"middle"};
  s2.addRow(["Урок","№","Операция","Дебет (Дт)","Кредит (Кт)","Сумма, $","Результат"]); head(s2,s2.getRow(2));
  s2.columns.forEach((c,i)=>c.width=[8,5,52,24,24,12,14][i]);
  let r=3, k=1;
  LESSONS.slice(0,S.cur+1).forEach((les,li)=>les.entries.forEach((e,i)=>{
    sk.getCell(k,1).value=e.dr; sk.getCell(k,2).value=e.cr; sk.getCell(k,3).value=e.sum;
    s2.getCell(r,1).value=li+1; s2.getCell(r,2).value=i+1; s2.getCell(r,3).value=e.q; s2.getCell(r,3).alignment={wrapText:true,vertical:"top"};
    ["D","E"].forEach(col=>{ s2.getCell(`${col}${r}`).dataValidation={type:"list",allowBlank:true,formulae:[listRef]}; s2.getCell(`${col}${r}`).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF8E6"}}; });
    s2.getCell(`F${r}`).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF8E6"}}; s2.getCell(`F${r}`).numFmt="#,##0";
    s2.getCell(`G${r}`).value={formula:`IF(OR(D${r}="",E${r}="",F${r}=""),"",IF(AND(D${r}='_ответы'!A${k},E${r}='_ответы'!B${k},F${r}='_ответы'!C${k}),"верно","неверно"))`};
    r++; k++;
  }));
  s2.addConditionalFormatting({ref:`G3:G${r}`,rules:[
    {type:"containsText",operator:"containsText",text:"неверно",style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:"FFFBE9E7"}},font:{color:{argb:"FFB3261E"},bold:true}}},
    {type:"cellIs",operator:"equal",formulae:['"верно"'],style:{fill:{type:"pattern",pattern:"solid",bgColor:{argb:"FFE5F4EC"}},font:{color:{argb:"FF1E7A46"},bold:true}}}
  ]});
  s2.views=[{state:"frozen",ySplit:2}];

  /* Лист 3: Пустой журнал */
  const s3 = wb.addWorksheet("Журнал проводок");
  s3.addRow(["General Journal (джена́рал джё́рнал) — журнал проводок. Каждая проводка: строка дебета, затем строка кредита."]);
  s3.mergeCells("A1:E1"); s3.getRow(1).font={italic:true}; s3.getRow(1).height=30; s3.getCell("A1").alignment={wrapText:true,vertical:"middle"};
  s3.addRow(["Date (дата)","Account (счёт)","Debit (дебет)","Credit (кредит)","Description (пояснение)"]); head(s3,s3.getRow(2));
  s3.columns.forEach((c,i)=>c.width=[14,26,14,14,44][i]);
  for(let i=3;i<=52;i++){
    s3.getCell(`A${i}`).numFmt="dd.mm.yyyy";
    s3.getCell(`B${i}`).dataValidation={type:"list",allowBlank:true,formulae:[listRef]};
    s3.getCell(`C${i}`).numFmt="#,##0.00"; s3.getCell(`D${i}`).numFmt="#,##0.00";
  }
  s3.getCell("B53").value="Итого"; s3.getCell("B53").font={bold:true};
  s3.getCell("C53").value={formula:"SUM(C3:C52)"}; s3.getCell("D53").value={formula:"SUM(D3:D52)"};
  s3.getCell("C53").numFmt="#,##0.00"; s3.getCell("D53").numFmt="#,##0.00";
  s3.getCell("E53").value={formula:`IF(C53=D53,"Дебет равен кредиту — верно","Дебет не равен кредиту — ищите ошибку")`};
  s3.getRow(53).font={bold:true};
  s3.views=[{state:"frozen",ySplit:2}];

  /* Лист 4: Мои ответы */
  const s4 = wb.addWorksheet("Мои ответы");
  s4.addRow(["Урок","Задание","Мой ответ","Правильный ответ","Результат"]); head(s4,s4.getRow(1));
  s4.columns.forEach((c,i)=>c.width=[8,46,40,40,12][i]);
  LESSONS.slice(0,S.cur+1).forEach((les,li)=>{
    const A=ans(les.id);
    les.entries.forEach((e,i)=>{ const a=A.a[i]||{};
      s4.addRow([li+1, e.q, a.dr?`Дт ${a.dr} / Кт ${a.cr||"—"} / ${a.sum??"—"}`:"—", `Дт ${e.dr} / Кт ${e.cr} / ${e.sum}`, A.checked?(checkEntry(e,a)?"верно":"неверно"):"не проверено"]); });
    les.transl.forEach((t,i)=>{ s4.addRow([li+1, `Перевод: ${t.en}`, A.b[i]||"—", t.ans, A.checked?(checkTr(t,A.b[i])?"верно":"неверно"):"не проверено"]); });
  });
  s4.eachRow(row=>row.alignment={wrapText:true,vertical:"top"});

  /* Служебный лист для восстановления */
  const sd = wb.addWorksheet("_data",{state:"veryHidden"});
  sd.getCell("A1").value = JSON.stringify(S);
  return wb;
}

async function downloadXl(){
  const m=document.getElementById("xlMsg");
  if(typeof ExcelJS==="undefined"){ m.innerHTML=`<div class="msg bad">Не удалось подготовить файл. Обновите страницу и попробуйте снова.</div>`; return; }
  m.innerHTML=`<div class="msg">Готовлю файл…</div>`;
  const d=new Date(); const stamp=`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
  S.savedAt = stamp + " " + String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const wb = await buildWorkbook();
  const buf = await wb.xlsx.writeBuffer();
  const name = `Американский учёт ${stamp}.xlsx`;
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await Promise.race([window.claude.use("downloads"), new Promise(r=>setTimeout(()=>r(null),3000))]); }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename:name, data:new Blob([buf])}); save(); m.innerHTML=`<div class="msg ok">Файл сохранён.</div>`; rCopyStamp(); }
    catch(e){ m.innerHTML = e && e.code==="declined" ? `<div class="msg">Сохранение отменено.</div>` : `<div class="msg bad">Не удалось сохранить файл. Попробуйте ещё раз.</div>`; }
  } else {
    const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); save(); m.innerHTML=`<div class="msg ok">Файл скачан.</div>`;
  }
}
function rCopyStamp(){ const p=V.querySelector("p.muted:last-of-type"); if(p) p.textContent="Последняя копия: "+S.savedAt; }

async function restore(ev){
  const m=document.getElementById("rfMsg"), f=ev.target.files[0]; if(!f) return;
  try{
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
    const sd=wb.getWorksheet("_data"); const raw = sd && sd.getCell("A1").value;
    if(!raw) throw 0;
    const data=JSON.parse(String(raw));
    if(!data || typeof data!=="object" || !data.answers) throw 0;
    S=Object.assign({cur:0,answers:{},done:{},savedAt:null},data);
    if(S.cur>=LESSONS.length) S.cur=LESSONS.length-1;
    save(); m.innerHTML=`<div class="msg ok">Данные восстановлены из файла.</div>`;
  }catch(e){ m.innerHTML=`<div class="msg bad">Это не файл копии из этого приложения. Выберите файл, скачанный кнопкой «Скачать файл Excel».</div>`; }
  ev.target.value="";
}

go("theory");
